<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Smart App - сабаққа дайындалуға тамаша құрал!</title>

  <!-- Fonts: Inter (body) + Outfit (headings) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap&subset=cyrillic"
    rel="stylesheet"
  />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />

  <!-- Tailwind config: consistent font tokens -->
  <script>
    window.tailwind = window.tailwind || {};
    window.tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: [
              "Inter",
              "ui-sans-serif",
              "system-ui",
              "-apple-system",
              "Segoe UI",
              "Roboto",
              "Arial",
              "Noto Sans",
              "sans-serif",
            ],
            display: [
              "Outfit",
              "Inter",
              "ui-sans-serif",
              "system-ui",
              "sans-serif",
            ],
          },
        },
      },
    };
  </script>

  <!-- Global styles: one system, premium typography -->
  <style>
    :root {
      --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI",
        Roboto, Arial, "Noto Sans", sans-serif;
      --font-display: "Outfit", "Inter", ui-sans-serif, system-ui, sans-serif;
      font-family: var(--font-sans);
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      margin: 0;
      font-family: var(--font-sans);
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.3s ease, color 0.3s ease;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
        env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* Headings = Outfit (display) */
    h1, h2, h3, h4,
    .font-display {
      font-family: var(--font-display);
      letter-spacing: -0.01em;
    }

    /* Default weights: keep things clean */
    h1 { font-weight: 800; }
    h2 { font-weight: 700; }
    h3 { font-weight: 700; }
    h4 { font-weight: 600; }

    /* Animation helpers (your original) */
    .animate-in { animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <!-- Importmap (leave as-is) -->
  <script type="importmap">
  {
    "imports": {
      "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
      "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
      "recharts": "https://esm.sh/recharts@^3.7.0",
      "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
      "vite": "https://esm.sh/vite@^7.3.1",
      "react/": "https://esm.sh/react@^19.2.3/",
      "react": "https://esm.sh/react@^19.2.3"
    }
  }
  </script>

</head>

<body class="bg-[#FDFDFD] dark:bg-[#0F172A] text-gray-900 dark:text-slate-100 select-none font-sans">
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>

</body>
</html>
